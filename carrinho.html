<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"
        defer></script>
    <!-- Script da página (módulo ES): mostra o carrinho e trata quantidades, exclusão e fechamento do pedido. -->
    <script type="module" src="js/pages/cart.js" defer></script>

</head>

<body>



    <!-- Modal -->
    <!-- Janela (modal do Bootstrap) "Pedido": resumo dos itens, tipo de entrega, cliente e total.
         O envio do formulário finaliza o pedido (tratado em cart.js). -->
    <form class="modal fade" id="formFinalizarPedido" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Pedido</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Área de mensagens de erro (pode ser usada para validações). -->
                    <div id="msg" class="text-danger fw-bold mb-3"></div>

                    <!-- Resumo dos itens do pedido (nome, quantidade e preço), preenchido por cart.js. -->
                    <div id="itensCarrinho">

                    </div>

                    <label for="tipo-entrega">Tipo de entrega:</label>
                    <br>
                    <!-- [TAXA] Tipo de entrega: delivery, retirada ou consumo local.
                         Ao escolher delivery em um pedido com marmita, a taxa de R$ 2,50 entra no total. -->
                    <select name="" id="inEntregaPedido">
                        <option value="">Selecione</option>
                        <option value="delivery">Delivery</option>
                        <option value="retirada">Retirada</option>
                        <option value="consumo_local">Consumo Local</option>
                    </select>

                    <br>

                    <label for="nome-produto">Cliente: </label>
                    <br>
                    <!-- Nome do cliente, guardado no pedido. -->
                    <input type="text" id="inClienteNome">

                    <br>

                    <label for="preco-produto">Total:</label>
                    <br>
                    <!-- Total do pedido (subtotal + taxa), atualizado por cart.js. -->
                    <h1 id="totalPedido"></h1>


                </div>
                <div class="modal-footer">
                    <!-- Botão que finaliza o pedido (dispara o submit tratado em cart.js). -->
                    <input type="submit" class="btn btn-primary" value="Finalizar Pedido"></input>
                </div>
            </div>
        </div>
    </form>

    <!-- Cabeçalho com logo, menu e botão do carrinho [IHC - consistência]. -->
    <header>

        <nav>

            <img src="assets/img/logo2.png" id="logo" alt="">

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cardapio.html">Cardapio</a></li>

            </ul>


            <div class="botoes">
                <a href="carrinho.html">
                    <button>
                        Carrinho
                        <i class="fas fa-shopping-cart me-2"></i>
                    </button>
                </a>

                
            </div>

        </nav>
    </header>

    <main>
        <section id="home">
            <!-- Título da seção. -->
            <h1 class="tituloSecao">Carrinho</h1>

            <!-- [CARRINHO] Subtotal dos itens, atualizado a cada mudança [IHC - visibilidade do estado]. -->
            <label for="">Subtotal: </label>
            <p>
                R$
                <span id="subtotal"></span>
            </p>
            <!-- Botão "Fechar pedido": abre o modal "Pedido". -->
            <input type="submit" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formFinalizarPedido"
                value="Fechar pedido" id="fechar-pedido">
            </input>




            <!--Aqui cart.js insere um card para cada item do carrinho. -->
            <div id="carrinho"></div>



            <!--Botão "Limpar Carrinho" (pede confirmação antes). -->
            <button id="limpar-carrinho" class="btn btn-primary">Limpar Carrinho</button>
        </section>

    </main>

    <!-- Rodapé (vazio). -->
    <footer>

    </footer>
</body>

</html>
