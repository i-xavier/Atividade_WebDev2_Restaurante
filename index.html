<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Restaurante AstroMeals</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"
        defer></script>
    <!-- Script da página (módulo ES): monta o carrossel com os produtos salvos. -->
    <script type="module" src="js/pages/index.js" defer></script>
</head>

<body>


    <!-- Cabeçalho com logo, menu (Home e Cardápio) e botão do carrinho. Repetido nas três páginas. -->
    <header>

        <nav>

            <img src="assets/img/logo2.png" id="logo" alt="">

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cardapio.html">Cardapio</a></li>

            </ul>


            <div class="botoes">
                <a href="carrinho.html">
                    <button>
                        Carrinho
                        <i class="fas fa-shopping-cart me-2"></i>
                    </button>
                </a>

            </div>

        </nav>
    </header>

    <!-- Conteúdo principal da página. -->
    <main>
        <section id="home">
            <h1 class="tituloSecao"> Restaurante <br> AstroMeals</h1>

            <!-- Texto de apresentação (provisório). -->
            <p>O melhor da região!</p>

            <!-- Container do carrossel: setas anterior/próximo e uma área rolável (.carrossel-wrapper)
                 onde index.js insere os slides dentro de #carrossel. -->
            <div class="container">
                <!-- Seta: slide anterior (clique tratado em index.js). -->
                <button class="fas fa-arrow-left"></button>
                <!-- Seta: próximo slide (clique tratado em index.js). -->
                <button class="fas fa-arrow-right"></button>
                <div class="carrossel-wrapper">
                    <!-- Aqui entram os slides (imagem, nome, preço e botão de carrinho). -->
                    <div id="carrossel">

                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- Rodapé (vazio). -->
    <footer>

    </footer>
</body>

</html>
