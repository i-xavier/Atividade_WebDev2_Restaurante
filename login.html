<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"
        defer></script>
    <script type="module" src="js/login.js" defer></script>

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>



    <!-- Modal -->
    <form class="modal fade" id="formModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Cadastrar Usuário</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="msg" class="text-danger fw-bold mb-3"></div>

                    <label for="">E-mail</label>
                    <input type="email" id="inEmail" placeholder="email@dominio.com">
                    <br>
                    <label for="">Senha</label>
                    <input type="password" id="inSenha1">
                    <br>
                    <label for="">Digite a senha novamente</label>
                    <input type="password" id="inSenha2">

                    <label for="">Tipo de usuário</label>
                    <input type="radio" name="tipoUser" value="cliente" id="cliente"> <label for="">Cliente</label>
                    <input type="radio" name="tipoUser" value="gerente" id="gerente"> <label for="">Gerente</label>

                </div>
                <div class="modal-footer">
                    <input type="submit" class="btn btn-secondary" data-bs-dismiss="modal" value="Close"></input>
                    <input type="submit" class="btn btn-primary" value="Cadastrar"></input>
                </div>
            </div>
        </div>
    </form>

    <header>

        <nav>

            <img src="/img/logo2.png" id="logo" alt="">

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cardapio.html">Cardapio</a></li>
                <li><a href="carrinho.html">Carrinho</a></li>
                <li><a href="pedido.html">Pedido</a></li>

            </ul>


            <div class="botoes">
                <button>
                    Pedir agora
                    <a class="fas fa-shopping-cart me-2" href=""></a>
                </button>

                <button>
                    Log-in
                    <i class="fas fa-sign-in-alt"></i>
                </button>
            </div>

        </nav>
    </header>

    <main>
        <section id="home">
            <h1 class="tituloSecao"> Log-in</h1>

            <form action="" id="formLogin">
                <label for="">E-mail</label>
                <input type="email" id="emailLogin">
                <br>
                <label for="">Senha</label>
                <input type="password" id="senhaLogin">
                <br>


                <input type="submit" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModal"
                    value="Registrar">
                </input>

                <input type="submit" value="Logar">

            </form>



        </section>

    </main>

    <footer>

    </footer>
</body>

</html>
